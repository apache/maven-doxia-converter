# see https://s.apache.org/asfyaml
github:
  description: "Apache Maven Doxia Converter"
  homepage: https://maven.apache.org/doxia/doxia-tools/doxia-converter/
  labels:
    - java
    - build-management
    - apache-maven
    - doxia
    - doxia-tools
  protected_branches:
    master: { }
  pull_requests:
    del_branch_on_merge: true
  enabled_merge_buttons:
    squash: true
    merge: false
    rebase: true
  autolink_jira:
    - DOXIATOOLS
    - DOXIA
    - MNGSITE
  features:
    issues: true
notifications:
  commits: commits@maven.apache.org
  issues: issues@maven.apache.org
  pullrequests: issues@maven.apache.org
# https://releases.apache.org/projects/maven-doxia-converter
project:
  metadata:
    key: maven-doxia-converter
    committee: maven
    name: Apache Maven Doxia Converter
    description: Doxia Converter Tool to convert a supported format to another.
    homepage: https://maven.apache.org/doxia/doxia-tools/doxia-converter/
    download_page: https://maven.apache.org/doxia/doxia-tools/doxia-converter/download.cgi
    bug_database: https://maven.apache.org/doxia/doxia-tools/doxia-converter/issue-management.html
    mailing_lists: https://maven.apache.org/doxia/doxia-tools/doxia-converter/mailing-lists.html
    repositories:
      - https://github.com/apache/maven-doxia-converter
    categories:
      - build-management
    programming_languages:
      - Java
  policy:
    announce_release_template_url: https://maven.apache.org/atr/templates/announce_release_template.txt
    start_vote_template_url: https://maven.apache.org/atr/templates/start_vote_template.txt
    finish_vote_template_url: https://maven.apache.org/atr/templates/finish_vote_template.txt
    github_repository_name: maven-doxia-converter
    download_path_suffix: doxia
    vote_recipients:
      to: dev@maven.apache.org
    announce_recipients:
      to: announce@maven.apache.org
      cc:
        - dev@maven.apache.org
        - users@maven.apache.org
  features:
    atr_sync: true
